name: 'ReviewAlly'
description: 'ReviewAlly — AI-powered pull request code review. Bring your own key (OpenAI, OpenAI-compatible, or Anthropic). Triggered by a label or a slash command.'
author: 'nethbotheju'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  api-type:
    description: 'LLM API protocol: openai | openai-chat-compatible | anthropic'
    required: true
  api-key:
    description: 'API key for the LLM provider (BYOK). Store this in a secret.'
    required: true
  base-url:
    description: 'Base URL of the API. Required for openai-chat-compatible. Optional override for openai/anthropic.'
    required: false
  model:
    description: 'Model identifier to use for the review (e.g. gpt-4o, claude-sonnet-4-5).'
    required: true

  github-token:
    description: 'GitHub token used to read the PR and post the review. Defaults to the automatic workflow token.'
    required: false
    default: ${{ github.token }}
  app-token-url:
    description: 'Endpoint of a ReviewAlly token minter (see minter/README.md). When set, the review is posted with the ReviewAlly GitHub App identity (custom name + logo) instead of github-actions[bot]. Consumers only need the App installed — no secrets. Falls back to the workflow identity if the App is not installed.'
    required: false
    default: ''

  trigger-comment:
    description: 'Slash command that triggers a review on a PR comment (case-insensitive).'
    required: false
    default: '/ai-review'
  trigger-label:
    description: 'PR label that triggers a review when added.'
    required: false
    default: 'ai-review'
  auto-review:
    description: 'When true, also review automatically on PR open/reopen/push (synchronize) without a label or command.'
    required: false
    default: 'false'

  max-files:
    description: 'Maximum number of changed files to review per run.'
    required: false
    default: '20'
  max-diff-lines:
    description: 'Maximum total added lines to review per run (protects token budget).'
    required: false
    default: '3000'
  exclude-patterns:
    description: 'Additional glob patterns to exclude (newline or comma separated), e.g. *.generated.ts, vendor/**'
    required: false
    default: ''
  use-default-excludes:
    description: 'Apply the built-in excludes for lockfiles, minified files, and sourcemaps. Build artifacts, dependencies, and VCS metadata are always excluded regardless of this setting.'
    required: false
    default: 'true'

  extra-instructions:
    description: 'Extra review guidance appended to the prompt (e.g. project conventions, style rules).'
    required: false
    default: ''

  # Agent-mode inputs
  review-mode:
    description: 'Review mode: standard (single prompt) or agent (tool-enabled investigation loop).'
    required: false
    default: 'standard'
  agent-tarball-max-mb:
    description: 'Maximum tarball size in MB for the repo snapshot (agent mode). Larger repos degrade to standard mode.'
    required: false
    default: '200'
  context-docs:
    description: 'Comma/newline-separated list of markdown doc files to include from the repo root (e.g. AGENTS.md, CONTRIBUTING.md).'
    required: false
    default: ''
  pi-version:
    description: 'Version of @earendil-works/pi-coding-agent to install for agent mode (e.g. 0.82.1, latest).'
    required: false
    default: '0.82.1'
  pi-timeout-ms:
    description: 'Hard timeout in milliseconds for a pi-engine review run. Guards against runaway loops since pi has no built-in step cap.'
    required: false
    default: '600000'

outputs:
  summary:
    description: 'The plain-text review summary produced by the model.'

runs:
  using: 'node24'
  main: 'dist/index.js'
