# AI code review — branded bot (posts the review with a custom name & avatar).
# Copy into your repo at .github/workflows/ai-code-review.yml and pin the action to @v1.
#
# EASIEST (zero secrets): install the ReviewAlly GitHub App on the repo, then just:
#
#       - uses: nethbotheju/ai-code-review@v1
#         with:
#           app-token-url: https://api.reviewally.nethbotheju.dev/token
#
# Reviews post as reviewally[bot] with the ReviewAlly logo. No APP_ID / private key.
# The manual App / PAT options below are only needed if you want your own identity.
#
# Triggers: add the "ai-review" label to a PR, or comment "/ai-review".
# Set auto-review: 'true' to also review on open / reopen / push.
#
# Required secrets:
#   AI_CODE_REVIEW_LLM_API_KEY — your provider API key.
#   APP_ID, APP_PRIVATE_KEY     — a GitHub App (with your name + logo) installed on this
#                                 repo, granted Pull requests: Read & write, Contents: Read.
#                                 The App only provides identity; the workflow triggers the action.
#
# Simpler alternative (one secret, no App): store a PAT as REVIEW_BOT_TOKEN and pass
# `github-token: ${{ secrets.REVIEW_BOT_TOKEN }}` directly — no token step needed.

name: ai-code-review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: nethbotheju/ai-code-review@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          api-type: openai            # openai | openai-chat-compatible | anthropic
          model: gpt-4o
          api-key: ${{ secrets.AI_CODE_REVIEW_LLM_API_KEY }}
          # auto-review: 'true'
          # extra-instructions: '...'
