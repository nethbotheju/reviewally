# ReviewAlly — copy into your repo at .github/workflows/reviewally.yml
#
# Requires: the ReviewAlly App installed (github.com/apps/reviewally) and one
# repository secret: REVIEWALLY_API_KEY (your provider API key).
#
# Triggers: add the "ai-review" label to a PR, or comment "/ai-review".
# Set auto-review: 'true' to also review on open / reopen / push.

name: reviewally

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: reviewally-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: nethbotheju/reviewally@v1
        with:
          app-token-url: https://api.reviewally.nethbotheju.dev/token
          api-type: openai            # openai | openai-chat-compatible | anthropic
          model: gpt-4o
          api-key: ${{ secrets.REVIEWALLY_API_KEY }}
          # base-url: 'https://opencode.ai/zen/go/v1'   # only for openai-chat-compatible
          # review-mode: agent         # deep repo-aware investigation
          # auto-review: 'true'
          # extra-instructions: '...'
