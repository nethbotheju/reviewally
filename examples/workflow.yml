# ReviewAlly — copy into your repo at .github/workflows/reviewally.yml
#
# Requires (one-time setup, all in the GitHub UI):
#   1. The ReviewAlly App installed (github.com/apps/reviewally)
#   2. One repository secret: REVIEWALLY_API_KEY (your provider API key)
#   3. Repository variables (Settings → Secrets and variables → Actions → Variables):
#        REVIEWALLY_API_TYPE   openai | openai-chat-compatible | anthropic
#        REVIEWALLY_MODEL      e.g. gpt-4o
#        REVIEWALLY_BASE_URL   only for openai-chat-compatible providers
#
# Model, review mode, auto-review, extra instructions, and excludes are all
# managed via REVIEWALLY_* variables — see the README. Adding one of them as
# an input below pins it for this workflow (inputs override variables).
#
# Triggers: add the "reviewally" label to a PR, or comment "/reviewally".
# Set the REVIEWALLY_AUTO_REVIEW variable to 'true' to also review on
# open / reopen / push.

name: reviewally

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: reviewally-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'reviewally'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/reviewally') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      actions: read        # required to read REVIEWALLY_* repository variables
      contents: read
      pull-requests: write
    steps:
      - uses: nethbotheju/reviewally@v1
        with:
          app-token-url: https://api.reviewally.nethbotheju.dev/token
          api-key: ${{ secrets.REVIEWALLY_API_KEY }}
          # Uncomment to pin a setting for this workflow (overrides the variable):
          # model: gpt-4o
          # review-mode: agent
